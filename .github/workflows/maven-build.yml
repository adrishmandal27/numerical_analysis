name: Java Maven Build

# This triggers the pipeline every time you push to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install Java (Temurin JDK 17 is standard for modern Maven builds)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Compile the Java code and package it into a .jar file
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    # 4. Upload the compiled .jar file so users can download it
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NumToolkit-Executable
        path: target/*.jar